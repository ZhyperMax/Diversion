<!doctype html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Juegos Salta | Acceso</title>
	<link rel="stylesheet" href="./modulos/login/login.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="" crossorigin="anonymous">
	<style>
		:root {
			--bg: #030611;
			--card: rgba(10, 14, 32, 0.9);
			--card-strong: rgba(14, 20, 45, 0.98);
			--border: rgba(124, 150, 255, 0.22);
			--text-main: #f8fafc;
			--text-soft: #a6b1d2;
			--accent: #5b8cff;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			min-height: 100%;
		}

		body {
			margin: 0;
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			background:
				radial-gradient(circle at 50% 10%, rgba(92, 140, 255, 0.18), transparent 22%),
				radial-gradient(circle at 12% 25%, rgba(255, 255, 255, 0.04), transparent 12%),
				radial-gradient(circle at 88% 76%, rgba(108, 82, 255, 0.08), transparent 15%),
				linear-gradient(180deg, #01040b 0%, var(--bg) 100%);
			color: var(--text-main);
		}

		body::before,
		body::after {
			content: "";
			position: fixed;
			inset: 0;
			pointer-events: none;
			opacity: 0.22;
			background-image:
				radial-gradient(circle at 9% 18%, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px),
				radial-gradient(circle at 90% 25%, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px),
				radial-gradient(circle at 14% 76%, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px),
				radial-gradient(circle at 86% 78%, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px);
			background-size: 100% 100%;
		}

		.auth-layout {
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
		}

		.auth-card {
			position: relative;
			width: min(100%, 560px);
			padding: 0;
			border-radius: 32px;
			background:
				linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 18%),
				linear-gradient(180deg, var(--card) 0%, var(--card-strong) 100%);
			border: 1px solid var(--border);
			box-shadow:
				0 0 0 1px rgba(255, 255, 255, 0.03) inset,
				0 28px 90px rgba(0, 0, 0, 0.62),
				0 0 56px rgba(58, 95, 255, 0.12);
			overflow: hidden;
		}

		.auth-card::before {
			content: "";
			position: absolute;
			inset: 0;
			padding: 1px;
			border-radius: inherit;
			background: linear-gradient(180deg, rgba(140, 165, 255, 0.34), rgba(140, 165, 255, 0.04) 50%, rgba(92, 140, 255, 0.2));
			mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
			mask-composite: exclude;
			pointer-events: none;
		}

		.auth-inner {
			position: relative;
			z-index: 1;
			display: grid;
			justify-items: center;
			text-align: center;
			gap: 1.15rem;
			padding: clamp(2rem, 4vw, 3rem);
		}

		.hero-icon {
			width: 104px;
			height: 104px;
			filter: drop-shadow(0 0 16px rgba(99, 141, 255, 0.28));
		}

		.hero-icon svg {
			width: 100%;
			height: auto;
		}

		.auth-kicker {
			margin: 0;
			font-size: 0.92rem;
			font-weight: 700;
			letter-spacing: 0.16em;
			text-transform: uppercase;
			color: #e5ebff;
		}

		.auth-title {
			margin: 0;
			font-size: clamp(2.2rem, 7vw, 4rem);
			line-height: 0.95;
			letter-spacing: 0.05em;
			text-transform: uppercase;
			font-weight: 900;
		}

		.auth-subtitle {
			margin: 0;
			font-size: 1.05rem;
			letter-spacing: 0.28em;
			text-transform: uppercase;
			color: var(--text-soft);
		}

		.divider {
			display: flex;
			align-items: center;
			gap: 0.9rem;
			width: 100%;
			max-width: 240px;
			justify-content: center;
			color: #6b8bff;
			font-size: 0.76rem;
			letter-spacing: 0.2em;
			text-transform: uppercase;
		}

		.divider::before,
		.divider::after {
			content: "";
			flex: 1;
			height: 1px;
			background: linear-gradient(90deg, transparent, rgba(95, 131, 255, 0.8), transparent);
		}

		.divider .icon {
			font-size: 1.1rem;
			line-height: 1;
			display: inline-block;
			color: #aab8ff;
		}

		.badges {
			display: flex;
			gap: 0.9rem;
			width: 100%;
			max-width: 300px;
			justify-content: center;
		}

		.badge-icon {
			width: 68px;
			height: 68px;
			display: grid;
			place-items: center;
			border-radius: 12px;
			font-size: 1.35rem;
			color: #e6ecff;
			background: transparent;
			transition: transform 220ms cubic-bezier(.2,.9,.2,1), box-shadow 220ms ease, color 160ms ease;
			will-change: transform, box-shadow;
		}

		/* hover/focus effects removed per user request */

		.login-stack {
			display: grid;
			gap: 0.8rem;
			width: 100%;
			margin-top: 0.4rem;
		}

		.login-stack .btn-google {
			width: 100%;
			max-width: none;
			height: 84px;
			border-radius: 14px;
			border: 1px solid rgba(255, 255, 255, 0.08);
			background: linear-gradient(180deg, #fdfdfd 0%, #eef2f8 100%);
			color: #172033;
			gap: 0.9rem;
			font-size: 1.12rem;
			box-shadow:
				0 10px 24px rgba(0, 0, 0, 0.34),
				0 0 0 1px rgba(255, 255, 255, 0.3) inset;
		}

		.login-stack .btn-google:hover {
			background: linear-gradient(180deg, #ffffff 0%, #edf2fb 100%);
		}

		.login-note {
			margin: 0.1rem 0 0;
			color: var(--text-soft);
			font-size: 0.95rem;
			line-height: 1.55;
		}

		.security-note {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 0.5rem;
			color: #8ca0d8;
			font-size: 0.92rem;
		}

		#auth-message {
			min-height: 1.2rem;
			margin: 0;
		}

		@media (max-width: 640px) {
			.auth-layout {
				padding: 14px;
			}

			.auth-inner {
				padding: 1.45rem;
				gap: 1rem;
			}

			.hero-icon {
				width: 92px;
				height: 92px;
			}

			.auth-subtitle {
				font-size: 0.9rem;
				letter-spacing: 0.18em;
			}

			.badges {
				max-width: 240px;
				gap: 0.6rem;
			}

			.badge-icon {
				width: 56px;
				height: 56px;
				font-size: 1.1rem;
			}

			.login-stack .btn-google {
				height: 76px;
				font-size: 1rem;
			}
		}
	</style>
</head>
<body>
	<main class="auth-layout">
		<section class="auth-card" aria-labelledby="login-title">
			<div class="auth-inner">
				<div class="hero-icon" aria-hidden="true">
					<svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M22 34.5C22 24.835 29.835 17 39.5 17H56.5C66.165 17 74 24.835 74 34.5V37.5C74 38.88 75.12 40 76.5 40H77C85.2843 40 92 46.7157 92 55V57.5C92 68.822 82.822 78 71.5 78H24.5C13.1782 78 4 68.822 4 57.5V55C4 46.7157 10.7157 40 19 40H19.5C20.8807 40 22 38.88 22 37.5V34.5Z" stroke="#6B8CFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
						<path d="M31 39H42M36.5 33.5V44.5" stroke="#5DD5FF" stroke-width="5" stroke-linecap="round"/>
						<circle cx="60" cy="39" r="3.5" fill="#FFCC4D"/>
						<circle cx="68" cy="44" r="3.5" fill="#FF6B6B"/>
						<circle cx="56" cy="48" r="3.5" fill="#5DD5FF"/>
						<circle cx="66" cy="53" r="3.5" fill="#8B8CFF"/>
					</svg>
				</div>

				<p class="auth-kicker">Bienvenido</p>
				<h1 class="auth-title" id="login-title">Portal de juegos</h1>
				<p class="auth-subtitle">A tu portal de juegos</p>

				<div class="divider" aria-hidden="true">
					<span class="icon"><i class="fa-solid fa-gamepad" aria-hidden="true"></i></span>
				</div>

				<div class="badges" aria-hidden="true">
					<i class="fa-solid fa-gamepad badge-icon" aria-hidden="true"></i>
					<i class="fa-solid fa-tv badge-icon" aria-hidden="true"></i>
					<i class="fa-solid fa-puzzle-piece badge-icon" aria-hidden="true"></i>
					<i class="fa-solid fa-headset badge-icon" aria-hidden="true"></i>
				</div>

				<header class="auth-header">
					<h2 style="margin:0;font-size:1.45rem;line-height:1.2;">Inicia sesión para continuar</h2>
					<p class="auth-subtitle" style="margin-top:0.65rem;letter-spacing:0.02em;text-transform:none;font-size:1.02rem;">Accede a todos tus juegos, logros y estadísticas desde cualquier dispositivo.</p>
				</header>

				<div class="login-stack">
					<button id="btn-google" type="button" class="btn btn-google" aria-label="Iniciar sesión con Google">
						<svg width="28" height="28" viewBox="0 0 48 48" aria-hidden="true">
							<path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303C33.649 32.657 29.204 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.963 3.037l5.657-5.657C34.046 6.053 29.271 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
							<path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 16.108 19.001 13 24 13c3.059 0 5.842 1.154 7.963 3.037l5.657-5.657C34.046 6.053 29.271 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
							<path fill="#4CAF50" d="M24 44c5.169 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.14 35.091 26.715 36 24 36c-5.183 0-9.615-3.316-11.283-7.946l-6.52 5.025C9.503 39.556 16.227 44 24 44z"/>
							<path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.05 12.05 0 0 1-4.084 5.57l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
						</svg>
						<span>Continuar con Google</span>
					</button>
					<p class="login-note">No hay ingreso manual. Si no tenés cuenta, Google la crea al instante.</p>
					<p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
					<div class="security-note">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
							<path d="M12 2L4 5.5V11c0 5.25 3.64 10.17 8 11 4.36-.83 8-5.75 8-11V5.5L12 2Z" stroke="#5C8BFF" stroke-width="1.8"/>
							<path d="M9.5 12.3L11 13.8L14.7 10.1" stroke="#5C8BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
						</svg>
						<span>Seguro, rápido y sin complicaciones</span>
					</div>
				</div>
			</div>
		</section>
	</main>

	<script type="module" src="./auth-main.js"></script>
</body>
</html>
